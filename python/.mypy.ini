[mypy]
exclude = 'out|venv.*|\.venv.*'

check_untyped_defs = True

[mypy-opendp._data]
disable_error_code =
  arg-type,

[mypy-opendp.accuracy]
disable_error_code =
  arg-type,

[mypy-opendp.combinators]
disable_error_code =
  arg-type,

[mypy-opendp.core]
disable_error_code =
  arg-type,

[mypy-opendp.domains]
disable_error_code =
  arg-type,

[mypy-opendp.measurements]
disable_error_code =
  arg-type,

[mypy-opendp.measures]
disable_error_code =
  arg-type,

[mypy-opendp.metrics]
disable_error_code =
  arg-type,

[mypy-opendp.transformations]
disable_error_code =
  arg-type,
  assignment,

[mypy-sklearn.*]
# Typing not available, so ignore.
ignore_missing_imports = True

[mypy-polars_to_ibis]
# TODO: Typing should be available, but it's not working.
# https://github.com/opendp/polars-to-ibis/issues/174
ignore_missing_imports = True
