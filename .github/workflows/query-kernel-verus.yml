name: Verify query kernel

on:
  push:
    branches: [verus-backend-semantics, verus-columnar-prototype, verified-stable-lazyframe]
    paths:
      - 'rust/query_kernel/**'
      - 'rust/query_verification/**'
      - 'rust/src/transformations/make_stable_vplan/**'
      - 'rust/src/core/verus/**'
      - 'rust/src/domains/verified_frame/**'
      - 'rust/src/domains/polars/frame/verus.rs'
      - 'rust/src/metrics/symmetric_distance/verus.rs'
      - 'rust/src/metrics/polars/frame_distance/verus.rs'
      - '.github/workflows/query-kernel-verus.yml'
  pull_request:
    branches: [verified-stable-lazyframe]
  workflow_dispatch:

concurrency:
  group: query-kernel-verus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verus:
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustc-dev,llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/query_kernel -> target
          cache-on-failure: true
      - name: Install pinned Verus
        run: |
          curl -fLsS --retry 3 -o verus.zip 'https://github.com/verus-lang/verus/releases/download/release%2F0.2026.11.02.8bf68ee/verus-0.2026.11.02.8bf68ee-x86-linux.zip'
          unzip -q verus.zip
          echo "$GITHUB_WORKSPACE/verus-x86-linux" >> "$GITHUB_PATH"
      - name: Verify specs and proofs
        working-directory: rust/query_kernel
        run: cargo verus verify
      - name: Verify OpenDP dataset stability
        working-directory: rust/query_verification
        run: cargo verus verify
      - name: Run executable reference tests
        working-directory: rust/query_kernel
        run: cargo test
      - name: Publish push verification status
        if: ${{ always() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERUS_RESULT: ${{ job.status }}
        run: |
          if [ "$VERUS_RESULT" = success ]; then state=success; else state=failure; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="query-kernel-verus" \
            -f description="Verus: $VERUS_RESULT" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
