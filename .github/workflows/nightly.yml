# Actually weekly, but we don't want to use up pypi space so quickly,
# and it takes us about a week to respond to failures in any case.
#
# Even if it just calls release.yml, this is useful to keep separate for the README badge.
name: Nightly
on:
  schedule:
    # 03:45 UTC = 22:45 EST/23:45 EDT (i.e., always before midnight), so nightlies will have a sensible date
    # 0 = Sunday: Run just once a week.
    - cron: '45 3 * * 0'

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      channel: nightly
      sync: true
    secrets: inherit
