# Even if it just calls release.yml, this is useful to keep separate for the README badge.
name: Weekly
on:
  schedule:
    # 03:45 UTC = 22:45 EST/23:45 EDT (i.e., always before midnight), so nightlies will have a sensible date
    # 0 = Sunday: Run just once a week.
    - cron: '45 3 * * 0'

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      channel: weekly
      sync: true
    secrets: inherit
